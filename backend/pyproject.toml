# Tooling configuration only; runtime dependencies are pinned in requirements.txt.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "W",
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear
    "UP",    # pyupgrade
    "SIM",   # simplify
    "C4",    # comprehensions
    "ASYNC", # async pitfalls
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # Starlette's TestClient prefers the httpx2 fork; httpx is what groq uses.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
